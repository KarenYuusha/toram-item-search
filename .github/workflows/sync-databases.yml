name: Sync canonical databases

# Temporary one-shot sync used by the implementation branch.
on:
  push:
    branches:
      - feat/streamlit-toram-database
    paths:
      - .github/workflows/sync-databases.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          ref: feat/streamlit-toram-database
          fetch-depth: 0

      - name: Check out canonical data repository
        uses: actions/checkout@v4
        with:
          repository: KarenYuusha/filter_search
          ref: main
          path: source

      - name: Copy canonical SQLite databases
        run: |
          cp source/coryn_data/database/items.sqlite ./items.sqlite
          cp source/coryn_data/database/skills.sqlite ./skills.sqlite

      - name: Commit database copies when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add items.sqlite skills.sqlite
          if git diff --cached --quiet; then
            echo "Databases are already current."
          else
            git commit -m "data: sync Toram databases"
            git push origin HEAD:feat/streamlit-toram-database
          fi
