name: Debug upgrade Don Trickster
on:
  push:
    branches: [debug/upgrade-don-trickster]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Inspect upgrade data and searches
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from toram_search.items.service import ItemSearchService
          from toram_search.database import ITEM_DATABASE

          print('ITEM_DATABASE', ITEM_DATABASE)
          db = sqlite3.connect(ITEM_DATABASE)
          db.row_factory = sqlite3.Row

          for term in ('don', 'trickster'):
              print('\nTERM', term)
              rows = db.execute(
                  "SELECT id,name,item_type FROM items WHERE lower(name) LIKE ? ORDER BY name",
                  (f'%{term}%',),
              ).fetchall()
              for row in rows:
                  print('ITEM', dict(row))
                  stats = db.execute(
                      "SELECT stat_name,amount,position FROM item_stats WHERE item_id=? AND stat_name='Upgrade for' ORDER BY position,id",
                      (row['id'],),
                  ).fetchall()
                  print('  UPGRADE_FOR', [dict(s) for s in stats])
                  succ = db.execute(
                      "SELECT i.id,i.name,i.item_type,s.amount FROM item_stats s JOIN items i ON i.id=s.item_id WHERE s.stat_name='Upgrade for' AND CAST(s.amount AS INTEGER)=? ORDER BY i.name",
                      (row['id'],),
                  ).fetchall()
                  print('  SUCCESSORS', [dict(s) for s in succ])

          service = ItemSearchService(ITEM_DATABASE)
          try:
              for q in ('upgrade Don','upgrade Trickster','upgrade don','upgrade trickster'):
                  out = service.search(q)
                  print('\nQUERY', q)
                  print('kind', out.kind, 'message', out.message, 'confidence', out.routing_confidence)
                  print('results', [(r.item.id, r.item.name, r.item.item_type, r.match_kind, r.score) for r in out.results])
          finally:
              service.close()
          PY
