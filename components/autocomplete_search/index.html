<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./streamlit_bridge.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Source Sans Pro", Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .autocomplete-wrap {
      position: relative;
      width: 100%;
    }

    .autocomplete-input,
    .autocomplete-ghost {
      box-sizing: border-box;
      width: 100%;
      min-height: 42px;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      font: inherit;
      font-size: 1rem;
      line-height: 1.4;
      white-space: pre;
    }

    .autocomplete-input {
      position: relative;
      z-index: 2;
      border: 1px solid rgba(49, 51, 63, 0.2);
      background: rgba(255, 255, 255, 0.01);
      color: inherit;
      outline: none;
    }

    .autocomplete-input:focus {
      border-color: #ff4b4b;
      box-shadow: 0 0 0 1px #ff4b4b;
    }

    .autocomplete-ghost {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      border: 1px solid transparent;
      color: rgba(128, 128, 128, 0.7);
    }

    .typed-space {
      visibility: hidden;
    }

    .hint {
      margin-top: 0.25rem;
      color: rgba(128, 128, 128, 0.9);
      font-size: 0.85rem;
    }

    .suggestion-list {
      display: none;
      margin-top: 0.35rem;
      border: 1px solid rgba(128, 128, 128, 0.25);
      border-radius: 0.5rem;
      overflow: hidden;
    }

    .suggestion-list.visible {
      display: block;
    }

    .suggestion-item {
      padding: 0.45rem 0.65rem;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .suggestion-item:hover,
    .suggestion-item.active {
      background: rgba(255, 75, 75, 0.12);
    }
  </style>
</head>
<body>
  <div class="autocomplete-wrap">
    <div id="ghost" class="autocomplete-ghost"></div>
    <input id="query" class="autocomplete-input" type="text" autocomplete="off" spellcheck="false" tabindex="0" />
  </div>
  <div id="hint" class="hint">Press Tab to autocomplete the best match. Press Enter to search.</div>
  <div id="suggestions" class="suggestion-list"></div>

  <script>
    const input = document.getElementById("query");
    const ghost = document.getElementById("ghost");
    const hint = document.getElementById("hint");
    const suggestionsEl = document.getElementById("suggestions");

    let suggestions = [];
    let currentSuggestion = "";

    function normalize(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9%:+-]+/g, " ").trim();
    }

    function fuzzyScore(query, candidate) {
      const q = normalize(query);
      const c = normalize(candidate);
      if (!q || !c) return 0;
      if (c === q) return 10000;
      if (c.startsWith(q)) return 9000 - Math.min(c.length, 500);
      if (c.includes(q)) return 7500 - c.indexOf(q);

      let score = 0;
      let lastIndex = -1;
      let streak = 0;

      for (const ch of q) {
        const index = c.indexOf(ch, lastIndex + 1);
        if (index === -1) return 0;
        streak = index === lastIndex + 1 ? streak + 1 : 1;
        score += 10 + streak * 4 - Math.min(index - lastIndex, 8);
        lastIndex = index;
      }

      return score - Math.abs(c.length - q.length) * 0.2;
    }

    function getMatches(value, limit = 5) {
      const typed = String(value || "").trim();
      if (!typed) return [];

      return suggestions
        .map((item) => ({ item, score: fuzzyScore(typed, item) }))
        .filter((entry) => entry.score > 0 && normalize(entry.item) !== normalize(typed))
        .sort((a, b) => b.score - a.score || a.item.length - b.item.length)
        .slice(0, limit)
        .map((entry) => entry.item);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;",
      }[char]));
    }

    function renderSuggestions(matches) {
      suggestionsEl.innerHTML = "";
      suggestionsEl.classList.toggle("visible", matches.length > 0);

      for (const match of matches) {
        const item = document.createElement("div");
        item.className = "suggestion-item";
        item.textContent = match;
        item.addEventListener("mousedown", (event) => {
          event.preventDefault();
          acceptSuggestion(match);
        });
        suggestionsEl.appendChild(item);
      }
    }

    function updatePreview() {
      const value = input.value;
      const matches = getMatches(value);
      currentSuggestion = matches[0] || "";

      if (currentSuggestion && normalize(currentSuggestion).startsWith(normalize(value))) {
        const typed = escapeHtml(value);
        const rest = escapeHtml(currentSuggestion.slice(value.length));
        ghost.innerHTML = `<span class="typed-space">${typed}</span>${rest}`;
      } else {
        ghost.innerHTML = "";
      }

      hint.textContent = currentSuggestion
        ? `Best match: ${currentSuggestion}. Press Tab to autocomplete.`
        : "Press Tab to autocomplete the best match. Press Enter to search.";
      renderSuggestions(matches);
      Streamlit.setFrameHeight(document.body.scrollHeight);
    }

    function sendValue(value) {
      Streamlit.setComponentValue(value);
    }

    function acceptSuggestion(value) {
      input.value = value;
      updatePreview();
      sendValue(value);
      input.focus();
    }

    input.addEventListener("input", () => {
      updatePreview();
    });

    input.addEventListener("blur", () => sendValue(input.value));

    input.addEventListener("keydown", (event) => {
      if (event.key === "Tab" && currentSuggestion) {
        event.preventDefault();
        acceptSuggestion(currentSuggestion);
        return;
      }

      if (event.key === "Enter") {
        event.preventDefault();
        sendValue(input.value);
      }
    });

    input.addEventListener("focus", updatePreview);

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, (event) => {
      const args = event.detail.args || {};
      suggestions = Array.isArray(args.suggestions) ? args.suggestions : [];
      const value = args.value || "";

      if (document.activeElement !== input && input.value !== value) {
        input.value = value;
      }

      input.placeholder = args.placeholder || "Search items, stats, or types...";
      updatePreview();
      Streamlit.setFrameHeight(document.body.scrollHeight);
    });

    Streamlit.setComponentReady();
  </script>
</body>
</html>
